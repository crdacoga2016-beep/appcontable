name: Build APK (Release firmada)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  APP_VERSION: '1.5.1'
  APP_VERSION_CODE: '3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor deps
        working-directory: ./app
        run: npm install

      - name: Add Android platform
        working-directory: ./app
        run: npx cap add android

      - name: Sync web assets
        working-directory: ./app
        run: npx cap sync android

      - name: Apply app icons
        run: |
          for d in app/resources/android/mipmap-*; do
            name=$(basename "$d")
            mkdir -p "app/android/app/src/main/res/$name"
            cp "$d"/* "app/android/app/src/main/res/$name/"
          done
          cp app/resources/android/values/ic_launcher_background.xml app/android/app/src/main/res/values/
          echo "Iconos aplicados:"
          ls app/android/app/src/main/res/mipmap-xxxhdpi/

      - name: Set app version
        working-directory: ./app/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${APP_VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null 2>&1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build unsigned release APK
        working-directory: ./app/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$HOME/android-sdk/build-tools/34.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED="app/android/app/build/outputs/apk/release/AppContable-${APP_VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppContable-${{ env.APP_VERSION }}
          path: app/android/app/build/outputs/apk/release/AppContable-${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/app/build/outputs/apk/release/AppContable-${{ env.APP_VERSION }}.apk
          generate_release_notes: true
